# V10 (SEC-03-01): known findings accepted for now. Each has a reason and an
# expiry date; after that date the CI scan fails again and someone must decide
# again (upgrade, or renew with a new reason). Keep this list short.
vulnerabilities:
  - id: CVE-2026-47884
    statement: >-
      Spring MVC XsltView remote code execution. Fixed only in Spring Framework
      7 (Spring Boot 4); 6.2.19 is the last free 6.2 release. Not reachable
      here: the API returns JSON only and has no XsltView, view resolver or
      template engine. Remove when the backend moves to Spring Boot 4.
    expired_at: 2026-12-07
  - id: CVE-2026-47890
    statement: >-
      Spring MVC stream corruption in Server-Sent Events with view fragments.
      Fixed only in Spring Framework 7. Not reachable here: the Dream Coach
      stream writes its own SSE frames as JSON (controller/ServerSentEvents)
      and never uses view fragments. Remove with the Spring Boot 4 move.
    expired_at: 2026-12-07
