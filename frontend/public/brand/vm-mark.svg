<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" role="img" aria-label="Vision Map mark">
  <defs>
    <linearGradient id="gv" x1="0" y1="1" x2="0.7" y2="0">
      <stop offset="0" stop-color="#006D77"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="ga" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#84CC16"/>
    </linearGradient>
  </defs>
  <!-- V whose right arm sweeps up into the arrow shaft -->
  <path d="M58,150 L166,436 L320,162" fill="none" stroke="url(#gv)" stroke-width="56" stroke-linejoin="miter"/>
  <!-- arrowhead continuing the shaft direction -->
  <polygon points="369,75 276,138 364,187" fill="url(#ga)"/>
  <!-- chart line with nodes, right of the shaft -->
  <path d="M300,326 L344,252 L386,306 L430,216" fill="none" stroke="url(#ga)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="344" cy="252" r="25" fill="#14B8A6"/>
  <circle cx="430" cy="216" r="25" fill="#84CC16"/>
  <!-- rising bar -->
  <rect x="466" y="252" width="54" height="188" rx="10" fill="#84CC16"/>
  <!-- star -->
  <polygon points="530,64 543,103 584,103 551,127 563,166 530,142 497,166 509,127 476,103 517,103" fill="#84CC16"/>
</svg>
