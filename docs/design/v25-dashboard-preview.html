<title>Vision Map Dashboard V25</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600&display=swap">
<style>
/* Layout: BRD 25 "Calm Fluent". 12-col grid, Today → Health → Insights; mobile re-orders by decision priority.
   Every value below is a BRD 25 token (sections 4–8), the same values as frontend/src/design/tokens.ts (phase 2). */
:root {
  --canvas: #F6F7F9; --surface: #FFFFFF; --surface-raised: #FFFFFF; --surface-sunken: #F1F3F5;
  --border: #E5E7EB; --border-hover: #D9DDE3; --divider: #EEF0F3; --border-strong: #8A939F;
  --text-primary: #1B1F24; --text-secondary: #57606A; --text-tertiary: #646C78;
  --brand: #0F6CBD; --brand-hover: #115EA3; --brand-pressed: #0C3B5E; --brand-subtle: #EBF3FC; --brand-subtle-fg: #0B5A9E; --on-brand: #FFFFFF;
  --focus-ring: #0F6CBD; --on-fill: #FFFFFF;

  --st-moving: #0F6CBD;  --st-moving-bg: #EBF3FC;  --st-moving-fg: #0B5A9E;
  --st-waiting: #3B2596; --st-waiting-bg: #EFECF9; --st-waiting-fg: #3B2596;
  --st-blocked: #E46C1E; --st-blocked-bg: #FDF0E7; --st-blocked-fg: #A8400C;
  --st-open: #B4009E;    --st-open-bg: #FBEAF8;    --st-open-fg: #9C0089;
  --st-declined: #C50F1F;--st-declined-bg: #FDECEE;--st-declined-fg: #B00E1C;
  --st-done: #0E6B0E;    --st-done-bg: #E9F4E9;    --st-done-fg: #0B5E0B;
  --st-idle: #6B7380;    --st-idle-bg: #F1F3F5;    --st-idle-fg: #57606A;
  --st-held: #3F4650;    --st-held-bg: #EEF0F3;    --st-held-fg: #3F4650;

  --chart-1: #2F6FDE; --chart-2: #E07A1F; --chart-3: #0F8A7C; --chart-4: #D25AA8; --chart-5: #2A2370; --chart-other: #8A939F;
  --heat-0: #EEF0F3; --heat-1: #C7DDF5; --heat-2: #8BB8EA; --heat-3: #3F85D4; --heat-4: #0F5AA6;

  --shadow-1: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --shadow-2: 0 4px 12px rgba(16,24,40,.08);
  --shadow-3: 0 12px 32px rgba(16,24,40,.14);
  --inner-hi: inset 0 0 0 0 transparent;

  --font: "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, "Noto Sans Khmer", Roboto, "Helvetica Neue", Arial, sans-serif;
  --lh-display: 40px; --lh-num: 44px; --lh-title: 28px; --lh-sub: 24px; --lh-body: 20px; --lh-cap: 16px;
  --track-display: -0.5px; --track-title: -0.2px; --track-over: 0.6px;

  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-pill: 999px;
  --motion-fast: 150ms; --motion-base: 200ms; --motion-slow: 250ms;
  --ease: cubic-bezier(0.2, 0, 0, 1); --ease-exit: cubic-bezier(0.4, 0, 1, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #0E1014; --surface: #171A1F; --surface-raised: #1E2228; --surface-sunken: #12151A;
  --border: #2A2F37; --border-hover: #363C46; --divider: #23272E; --border-strong: #6B7480;
  --text-primary: #E8EAED; --text-secondary: #A8B0BA; --text-tertiary: #8E97A3;
  --brand: #4FA3F0; --brand-hover: #6BB3F3; --brand-pressed: #8AC3F5; --brand-subtle: #1A2A3B; --brand-subtle-fg: #8AC3F5; --on-brand: #0E1014;
  --focus-ring: #4FA3F0; --on-fill: #0E1014;
  --st-moving: #4FA3F0;  --st-moving-bg: color-mix(in srgb, #4FA3F0 16%, #171A1F);  --st-moving-fg: #4FA3F0;
  --st-waiting: #7B6BE6; --st-waiting-bg: #27273F; --st-waiting-fg: #ABA0F5;
  --st-blocked: #E0612A; --st-blocked-bg: #372521; --st-blocked-fg: #F08A5D;
  --st-open: #EE6FD3;    --st-open-bg: color-mix(in srgb, #EE6FD3 16%, #171A1F);    --st-open-fg: #EE6FD3;
  --st-declined: #F47A84;--st-declined-bg: color-mix(in srgb, #F47A84 16%, #171A1F);--st-declined-fg: #F47A84;
  --st-done: #72D872;    --st-done-bg: #26382C;    --st-done-fg: #72D872;
  --st-idle: #98A1AD;    --st-idle-bg: #2C3036;    --st-idle-fg: #98A1AD;
  --st-held: #D3D8DE;    --st-held-bg: #35383E;    --st-held-fg: #D3D8DE;
  --chart-1: #4A86F0; --chart-2: #F09A4A; --chart-3: #1E8F81; --chart-4: #F290D2; --chart-5: #D9D4FF; --chart-other: #6B7480;
  --heat-0: #1E2228; --heat-1: #1D3550; --heat-2: #245487; --heat-3: #3477C2; --heat-4: #6BB3F3;
  --shadow-1: none; --shadow-2: none; --shadow-3: 0 12px 32px rgba(0,0,0,.5);
  --inner-hi: inset 0 1px 0 rgba(255,255,255,.03);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --canvas: #0E1014; --surface: #171A1F; --surface-raised: #1E2228; --surface-sunken: #12151A;
  --border: #2A2F37; --border-hover: #363C46; --divider: #23272E; --border-strong: #6B7480;
  --text-primary: #E8EAED; --text-secondary: #A8B0BA; --text-tertiary: #8E97A3;
  --brand: #4FA3F0; --brand-hover: #6BB3F3; --brand-pressed: #8AC3F5; --brand-subtle: #1A2A3B; --brand-subtle-fg: #8AC3F5; --on-brand: #0E1014;
  --focus-ring: #4FA3F0; --on-fill: #0E1014;
  --st-moving: #4FA3F0;  --st-moving-bg: color-mix(in srgb, #4FA3F0 16%, #171A1F);  --st-moving-fg: #4FA3F0;
  --st-waiting: #7B6BE6; --st-waiting-bg: #27273F; --st-waiting-fg: #ABA0F5;
  --st-blocked: #E0612A; --st-blocked-bg: #372521; --st-blocked-fg: #F08A5D;
  --st-open: #EE6FD3;    --st-open-bg: color-mix(in srgb, #EE6FD3 16%, #171A1F);    --st-open-fg: #EE6FD3;
  --st-declined: #F47A84;--st-declined-bg: color-mix(in srgb, #F47A84 16%, #171A1F);--st-declined-fg: #F47A84;
  --st-done: #72D872;    --st-done-bg: #26382C;    --st-done-fg: #72D872;
  --st-idle: #98A1AD;    --st-idle-bg: #2C3036;    --st-idle-fg: #98A1AD;
  --st-held: #D3D8DE;    --st-held-bg: #35383E;    --st-held-fg: #D3D8DE;
  --chart-1: #4A86F0; --chart-2: #F09A4A; --chart-3: #1E8F81; --chart-4: #F290D2; --chart-5: #D9D4FF; --chart-other: #6B7480;
  --heat-0: #1E2228; --heat-1: #1D3550; --heat-2: #245487; --heat-3: #3477C2; --heat-4: #6BB3F3;
  --shadow-1: none; --shadow-2: none; --shadow-3: 0 12px 32px rgba(0,0,0,.5);
  --inner-hi: inset 0 1px 0 rgba(255,255,255,.03);
  color-scheme: dark;
}
/* Khmer: taller lines for stacked subscripts, never tracked (BRD §4). */
:root:lang(km) {
  --lh-display: 48px; --lh-num: 48px; --lh-title: 34px; --lh-sub: 30px; --lh-body: 26px; --lh-cap: 22px;
  --track-display: 0; --track-title: 0; --track-over: 0;
}

* { box-sizing: border-box; }
body {
  background: var(--canvas); color: var(--text-primary);
  font-family: var(--font); font-size: 14px; line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: var(--r-sm); }
.num, .tnum { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

.wrap {
  max-width: 1360px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 96px;
}
@media (min-width: 1024px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

/* ---------- Preview controls (not part of the product) ---------- */
.preview-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: 10px 12px; margin-bottom: 24px;
  border: 1px dashed var(--border-strong); border-radius: var(--r-lg);
  font-size: 12px; line-height: 16px; color: var(--text-secondary);
}
.preview-bar strong { color: var(--text-primary); font-weight: 600; margin-right: 4px; }
.pv-group { display: inline-flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 4px 10px; cursor: pointer; font-size: 12px; line-height: 16px; color: var(--text-secondary); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--brand-subtle); color: var(--brand-subtle-fg); font-weight: 600; }
.pv-btn { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-md); padding: 4px 10px; cursor: pointer; font-size: 12px; }
.pv-btn:hover { border-color: var(--border-hover); }

/* ---------- Page header ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; margin-bottom: 32px; }
.page-head h1 { margin: 0; font-size: 32px; line-height: var(--lh-display); font-weight: 600; letter-spacing: var(--track-display); text-wrap: balance; }
.page-head .sub { margin: 4px 0 0; color: var(--text-secondary); }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.coach-badge { display: none; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: var(--r-pill); background: var(--surface-sunken); color: var(--text-secondary); font-size: 12px; font-weight: 500; margin-top: 8px; }
.is-coach .coach-badge { display: inline-flex; }
.is-coach .owner-only { display: none !important; }
.field { position: relative; }
.field select {
  appearance: none; height: 36px; padding: 0 32px 0 12px; border-radius: var(--r-md);
  border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; min-width: 0; max-width: 220px;
  transition: border-color var(--motion-fast) var(--ease);
}
.field select:hover { border-color: var(--text-secondary); }
.field svg { position: absolute; right: 10px; top: 10px; pointer-events: none; color: var(--text-secondary); }
.btn-primary {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 0; border-radius: var(--r-md);
  background: var(--brand); color: var(--on-brand); font-weight: 600; cursor: pointer;
  transition: background var(--motion-fast) var(--ease), transform var(--motion-fast) var(--ease);
}
.btn-primary:hover { background: var(--brand-hover); }
.btn-primary:active { background: var(--brand-pressed); transform: scale(.98); }
.btn-primary svg.i { width: 20px; height: 20px; }

/* ---------- Grid & zones ---------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; }
.zone { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; margin-top: 8px; margin-bottom: -8px; }
.zone:first-child { margin-top: 0; }
.overline { margin: 0; font-size: 11px; line-height: var(--lh-cap); font-weight: 600; letter-spacing: var(--track-over); text-transform: uppercase; color: var(--text-tertiary); }
:root:lang(km) .overline { text-transform: none; font-size: 12px; }
.c-next { grid-column: span 8; } .c-prog { grid-column: span 4; } .c-kpis { grid-column: 1 / -1; }
.c-areas { grid-column: span 7; } .c-status { grid-column: span 5; }
.c-trend { grid-column: span 7; } .c-tabs { grid-column: span 5; }
.more-toggle { display: none; }

/* ---------- Card ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  box-shadow: var(--shadow-1), var(--inner-hi); padding: 20px; min-width: 0; position: relative;
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.card-head h2, .card-head h3 { margin: 0; font-size: 16px; line-height: var(--lh-sub); font-weight: 600; }
.card-head .cap { margin: 2px 0 0; }
.cap { font-size: 12px; line-height: var(--lh-cap); color: var(--text-secondary); letter-spacing: .1px; }
:root:lang(km) .cap { letter-spacing: 0; }
.link {
  display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; padding: 2px 0; cursor: pointer;
  color: var(--brand); font-size: 13px; font-weight: 500; white-space: nowrap;
}
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.ghost {
  display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border: 1px solid transparent; border-radius: var(--r-md);
  background: none; color: var(--text-secondary); font-size: 12px; cursor: pointer; flex: none;
  transition: background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease);
}
.ghost:hover { background: var(--surface-sunken); }
.ghost[aria-pressed="true"] { border-color: var(--border); background: var(--surface-sunken); color: var(--text-primary); }

/* ---------- Status chip (colour + icon + label) ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: var(--r-pill);
  font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap;
  background: var(--c-bg); color: var(--c-fg);
}
.chip svg.i { width: 14px; height: 14px; }
.s-moving  { --c: var(--st-moving);  --c-bg: var(--st-moving-bg);  --c-fg: var(--st-moving-fg); }
.s-waiting { --c: var(--st-waiting); --c-bg: var(--st-waiting-bg); --c-fg: var(--st-waiting-fg); }
.s-blocked { --c: var(--st-blocked); --c-bg: var(--st-blocked-bg); --c-fg: var(--st-blocked-fg); }
.s-open    { --c: var(--st-open);    --c-bg: var(--st-open-bg);    --c-fg: var(--st-open-fg); }
.s-declined{ --c: var(--st-declined);--c-bg: var(--st-declined-bg);--c-fg: var(--st-declined-fg); }
.s-done    { --c: var(--st-done);    --c-bg: var(--st-done-bg);    --c-fg: var(--st-done-fg); }
.s-idle    { --c: var(--st-idle);    --c-bg: var(--st-idle-bg);    --c-fg: var(--st-idle-fg); }
.s-held    { --c: var(--st-held);    --c-bg: var(--st-held-bg);    --c-fg: var(--st-held-fg); }
.chip.s-held { box-shadow: inset 0 0 0 1px var(--st-held); }

/* ---------- Next up ---------- */
.task-list { list-style: none; margin: 0; padding: 0; }
.task {
  display: grid; grid-template-columns: 24px minmax(0, 1fr) auto 16px; align-items: center; gap: 4px 12px;
  padding: 10px 8px; margin: 0 -8px; border-radius: var(--r-md);
  transition: background var(--motion-fast) var(--ease);
}
.task + .task { border-top: 1px solid var(--divider); border-radius: 0; }
.task:hover { background: var(--surface-sunken); border-radius: var(--r-md); }
.task:hover + .task { border-top-color: transparent; }
.task-title { font-weight: 500; overflow-wrap: anywhere; }
.task-meta { display: flex; align-items: center; gap: 12px; justify-self: end; }
.task .chev { color: var(--text-tertiary); }
.task.is-done .task-title { text-decoration: line-through; color: var(--text-tertiary); }
.task-reason { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.prio { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; color: var(--text-secondary); white-space: nowrap; }
.prio.hi { color: var(--text-primary); font-weight: 600; }
.prio svg.i { width: 14px; height: 14px; }
.due { font-size: 12px; line-height: 16px; color: var(--text-secondary); min-width: 64px; text-align: right; white-space: nowrap; }
.due.late { color: var(--st-declined-fg); font-weight: 600; }
.due.today { color: var(--text-primary); font-weight: 600; }
.check {
  width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border-strong); background: none; padding: 0;
  display: grid; place-items: center; cursor: pointer; color: transparent;
  transition: background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease), transform var(--motion-fast) var(--ease);
}
.check:hover { border-color: var(--st-done); color: var(--st-done); }
.check:active { transform: scale(.9); }
.check[aria-checked="true"] { background: var(--st-done); border-color: var(--st-done); color: var(--on-fill); }
.check svg.i { width: 12px; height: 12px; stroke-width: 2.5; }
.is-coach .check { display: none; }
.is-coach .task { grid-template-columns: minmax(0, 1fr) auto 16px; }
.is-coach .task-reason { grid-column: 1 / 3; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--divider); }

/* ---------- Progress ring ---------- */
.prog-body { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding-top: 4px; }
.ring { position: relative; width: 140px; height: 140px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring .track { stroke: var(--surface-sunken); }
.ring .fill { stroke: var(--brand); stroke-linecap: round; transition: stroke-dashoffset 600ms var(--ease); }
.ring-val { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; line-height: var(--lh-num); font-weight: 600; letter-spacing: -0.5px; }
.ring-val small { font-size: 18px; font-weight: 600; color: var(--text-secondary); margin-left: 1px; }
.delta { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--st-done-fg); }
.delta.neg { color: var(--st-declined-fg); }
.portfolio { color: var(--text-secondary); font-size: 12px; line-height: var(--lh-cap); max-width: 30ch; }
.portfolio b { color: var(--text-primary); font-weight: 600; }
.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; border-radius: inherit; }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.kpi {
  text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px;
  transition: box-shadow var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease), background var(--motion-fast) var(--ease);
}
.kpi:hover { box-shadow: var(--shadow-2), var(--inner-hi); border-color: var(--border-hover); }
.kpi-label { font-size: 13px; line-height: var(--lh-cap); color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.kpi-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kpi-num { font-size: 40px; line-height: var(--lh-num); font-weight: 600; letter-spacing: -0.5px; }
.kpi-tag { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }
.kpi-tag.up-bad { color: var(--st-declined-fg); }
.kpi .cap { color: var(--text-tertiary); }
.kpi.clear .kpi-num { color: var(--st-done-fg); font-size: 20px; line-height: var(--lh-num); display: inline-flex; align-items: center; gap: 6px; }
.kpi.clear .kpi-num svg.i { width: 24px; height: 24px; }

/* ---------- Area progress ---------- */
.area-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.area {
  display: grid; grid-template-columns: minmax(96px, 1fr) minmax(0, 2fr) 44px 16px; align-items: center; gap: 4px 16px;
  padding: 10px 8px; margin: 0 -8px; border-radius: var(--r-md); cursor: pointer; border: 0; background: none; text-align: left; width: calc(100% + 16px);
  transition: background var(--motion-fast) var(--ease);
}
.area:hover { background: var(--surface-sunken); }
.area-name { display: flex; align-items: center; gap: 8px; font-weight: 500; min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c); }
.area-sub { grid-column: 1 / 2; font-size: 12px; line-height: var(--lh-cap); color: var(--text-tertiary); padding-left: 16px; }
.bar { position: relative; height: 8px; background: var(--surface-sunken); border-radius: var(--r-pill); }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--c); transform-origin: left; animation: grow 600ms var(--ease) both; }
.bar > b { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--text-primary); opacity: .55; }
.area .pct { text-align: right; font-weight: 600; }
.area .chev { color: var(--text-tertiary); }
.area-bar-cell { grid-row: 1 / 3; grid-column: 2; }
.area-pct-cell { grid-row: 1 / 3; grid-column: 3; }
.area-chev-cell { grid-row: 1 / 3; grid-column: 4; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ---------- Stacked status bars ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.legend .chip { height: 22px; }
.stack-row + .stack-row { margin-top: 18px; }
.stack-label { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
.stack-label b { font-weight: 600; }
.stack { display: flex; gap: 2px; height: 22px; border-radius: var(--r-pill); overflow: hidden; background: var(--surface); }
.stack > span {
  background: var(--c); color: var(--on-fill); font-size: 11px; font-weight: 700; line-height: 22px; text-align: center;
  overflow: hidden; white-space: nowrap; transform-origin: left; animation: grow 600ms var(--ease) both;
}
/* Paused = striped neutral, so it never merges with Not started (same family, different form). */
.stack > span.s-held { background: repeating-linear-gradient(135deg, var(--st-held) 0 3px, color-mix(in srgb, var(--st-held) 40%, var(--surface)) 3px 7px); }
.stack > span:first-child { border-radius: var(--r-pill) 0 0 var(--r-pill); }
.stack > span:last-child { border-radius: 0 var(--r-pill) var(--r-pill) 0; }
.mini-areas { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--divider); font-size: 12px; color: var(--text-secondary); }
.mini-areas span { display: inline-flex; align-items: center; gap: 6px; }
.mini-areas b { color: var(--text-primary); font-weight: 600; }

/* ---------- Trend chart ---------- */
.chart { position: relative; height: 220px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart text { font-size: 12px; fill: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.chart .grid-l { stroke: var(--divider); stroke-dasharray: 2 4; }
.chart .ref { stroke: var(--text-tertiary); stroke-dasharray: 4 4; }
.chart .ref-t { fill: var(--text-secondary); font-weight: 500; }
.chart .line { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 600ms var(--ease) forwards; }
.chart .cur { fill: var(--brand); stroke: var(--surface); stroke-width: 2; }
.chart .cur-t { fill: var(--text-primary); font-weight: 600; font-size: 13px; }
.chart .guide { stroke: var(--border-strong); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.tip {
  position: absolute; pointer-events: none; z-index: 2; min-width: 120px;
  background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-3);
  padding: 10px 12px; font-size: 12px; line-height: 16px; transition: opacity var(--motion-fast) var(--ease);
}
.tip .t { color: var(--text-secondary); margin-bottom: 6px; }
.tip .r { display: flex; align-items: center; gap: 8px; }
.tip .r i { width: 8px; height: 8px; border-radius: 2px; background: var(--brand); }
.tip .r b { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Tabs (Insights) ---------- */
.tablist { display: flex; gap: 4px; padding: 3px; background: var(--surface-sunken); border-radius: var(--r-md); margin-bottom: 16px; overflow-x: auto; }
.tab {
  flex: 1; border: 0; background: none; height: 30px; padding: 0 10px; border-radius: var(--r-sm); cursor: pointer; white-space: nowrap;
  color: var(--text-secondary); font-size: 13px; font-weight: 500;
  transition: background var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease);
}
.tab:hover { color: var(--text-primary); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--text-primary); box-shadow: var(--shadow-1); }
:root[data-theme="dark"] .tab[aria-selected="true"] { box-shadow: inset 0 0 0 1px var(--border); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab[aria-selected="true"] { box-shadow: inset 0 0 0 1px var(--border); } }
.panel:not(.is-active) { display: none; }
.panel { animation: fade var(--motion-base) var(--ease); }
.panel-title { display: none; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.blocked-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-sunken); margin-bottom: 16px; font-size: 13px; }
.obst-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.obst-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.obst-name { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.obst-meta { display: flex; align-items: center; gap: 8px; flex: none; font-size: 12px; color: var(--text-secondary); }
.sev { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
.sev .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.sev .bars i { width: 3px; border-radius: 1px; background: var(--border-strong); opacity: .45; }
.sev .bars i.on { background: var(--text-primary); opacity: 1; }
.obst-list .bar { height: 6px; }

.pipe { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-bottom: 18px; }
.stage {
  border: 0; background: var(--surface-sunken); padding: 10px 10px 12px; text-align: left; cursor: pointer; min-width: 0;
  display: flex; flex-direction: column; gap: 2px; transition: background var(--motion-fast) var(--ease);
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%, 8px 50%);
}
.stage:first-child { clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%); border-radius: var(--r-md) 0 0 var(--r-md); }
.stage:last-child { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 8px 50%); border-radius: 0 var(--r-md) var(--r-md) 0; }
.stage:hover { background: var(--brand-subtle); }
.stage .n { font-size: 24px; line-height: 30px; font-weight: 600; padding-left: 8px; }
.stage .l { font-size: 11px; line-height: 14px; color: var(--text-secondary); padding-left: 8px; overflow-wrap: anywhere; }
.stage:first-child .n, .stage:first-child .l { padding-left: 0; }
.follow { list-style: none; margin: 0; padding: 0; }
.follow li { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
.follow li + li { border-top: 1px solid var(--divider); }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-sunken); color: var(--text-secondary); font-size: 11px; font-weight: 600; }
.follow .who { min-width: 0; flex: 1; }
.follow .who div:first-child { font-weight: 500; }

.streak { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.streak .big { font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.5px; }
.heat { display: grid; grid-template-columns: auto repeat(12, minmax(0, 16px)); gap: 3px; align-items: center; }
.heat .dl { font-size: 11px; line-height: 12px; color: var(--text-tertiary); padding-right: 6px; }
.heat .cell { aspect-ratio: 1; border-radius: 3px; background: var(--heat-0); max-width: 100%; }
.heat .cell.l1 { background: var(--heat-1); } .heat .cell.l2 { background: var(--heat-2); } .heat .cell.l3 { background: var(--heat-3); } .heat .cell.l4 { background: var(--heat-4); }
.heat-legend { display: flex; align-items: center; gap: 3px; margin-top: 12px; font-size: 11px; color: var(--text-tertiary); }
.heat-legend .cell { width: 12px; height: 12px; border-radius: 3px; }
.heat-legend span { margin: 0 4px; }

/* ---------- Tables (View as table) ---------- */
.tbl-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: left; font-weight: 600; color: var(--text-secondary); font-size: 12px; background: var(--surface-sunken); padding: 8px 10px; }
table.data th:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); } table.data th:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
table.data td { padding: 8px 10px; border-bottom: 1px solid var(--divider); font-variant-numeric: tabular-nums; }
table.data td.n, table.data th.n { text-align: right; }

/* ---------- States ---------- */
.err {
  display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--r-md);
  background: var(--surface-sunken); color: var(--text-primary); font-size: 13px;
}
.err svg.i { color: var(--st-declined-fg); width: 20px; height: 20px; margin-top: 1px; }
.err .cap { margin-top: 2px; }
.err button { margin-top: 10px; }
.btn-sec { height: 32px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 500; }
.btn-sec:hover { background: var(--surface-sunken); }
.sk { background: var(--surface-sunken); border-radius: var(--r-md); position: relative; overflow: hidden; }
.sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 55%, transparent), transparent); transform: translateX(-100%); animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
.first-run { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 32px; align-items: center; padding: 40px; }
.first-run h2 { margin: 0 0 8px; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: var(--track-title); text-wrap: balance; }
:root:lang(km) .first-run h2 { line-height: 40px; }
.first-run p { margin: 0 0 20px; color: var(--text-secondary); max-width: 46ch; }
.steps { list-style: none; margin: 0 0 24px; padding: 0; display: grid; gap: 10px; }
.steps li { display: flex; align-items: center; gap: 12px; }
.steps .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--surface-sunken); color: var(--text-secondary); flex: none; }
.steps li:first-child .n { background: var(--brand); color: var(--on-brand); }
.first-run svg.art { width: 100%; max-width: 420px; height: auto; justify-self: center; }
.first-run svg.art .hill { fill: none; stroke: var(--text-tertiary); stroke-width: 2; stroke-linecap: round; }
.first-run svg.art .path { fill: none; stroke: var(--brand); stroke-width: 2.5; stroke-dasharray: 2 7; stroke-linecap: round; }
.first-run svg.art .pole { stroke: var(--text-primary); stroke-width: 2; stroke-linecap: round; }
.first-run svg.art .flag { fill: var(--brand); }
.first-run svg.art .me { fill: var(--surface); stroke: var(--brand); stroke-width: 2.5; }
.first-run svg.art .sun { fill: none; stroke: var(--text-tertiary); stroke-width: 1.5; }

/* ---------- Toasts & FAB ---------- */
.toasts {
  position: fixed; z-index: 30; display: grid; gap: 8px; width: min(380px, calc(100vw - 32px));
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
.toast {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r-lg);

  animation: rise var(--motion-base) var(--ease);
}
.toast svg.i { color: var(--st-done-fg); width: 20px; height: 20px; }
.toast .link { margin-left: auto; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.fab { display: none; }

/* ---------- Tablet ---------- */
@media (max-width: 1023px) {
  .grid { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 16px; }
  .zone { margin-bottom: 0; }

  .kpis { gap: 16px; }
  .first-run { grid-template-columns: 1fr; padding: 28px; }

}

@media (max-width: 599px) {

  .c-tabs .panel { grid-column: 1 / -1; display: block; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-1), var(--inner-hi); padding: 16px; animation: none; min-width: 0; }
  .panel-title { display: block; margin: 0 0 12px; font-size: 16px; line-height: var(--lh-sub); font-weight: 600; }
  .prog-body { flex-direction: row; text-align: left; gap: 16px; padding: 0; }

  .kpi { padding: 12px; }

  .task { grid-template-columns: 24px minmax(0, 1fr) 16px; }
  .task-meta { grid-column: 2 / 3; grid-row: 2; justify-self: start; }
  .task .chev { grid-column: 3; grid-row: 1; }

  .is-coach .task { grid-template-columns: minmax(0, 1fr) 16px; }

  .area { grid-template-columns: minmax(0, 1fr) 40px 16px; }
  .area-bar-cell { grid-row: 2; grid-column: 1 / 2; }

  .fab {

    right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }

}

.more-toggle {

  border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 600;

  function status() {
    const stack = (label, data) => {
      const total = ORDER.reduce((s, k) => s + data[k], 0);
      const segs = ORDER.filter((k) => data[k] > 0).map((k, i) => {
        const w = (data[k] / total) * 100;
        return `<span class="s-${STATUS_CLASS[k]}" style="flex:${data[k]} 0 0;animation-delay:${i * 40}ms" title="${esc(t(k))}: ${data[k]}">${w >= 7 && k !== 'PAUSED' ? data[k] : ''}</span>`;
      }).join('');
      const aria = `${label}: ${total}. ` + ORDER.map((k) => `${t(k)} ${data[k]}`).join(', ');
      return `<div class="stack-row"><div class="stack-label"><span>${esc(label)}</span><b class="num">${fmt(total)}</b></div>
        <div class="stack" role="img" aria-label="${esc(aria)}">${segs}</div></div>`;

    const part = state === 'error' ? `<p class="panel-title">${esc(t('partTitle'))}</p>${errBox()}` : `<p class="panel-title">${esc(t('partTitle'))}</p>
      <div class="pipe">${PIPE.map((n, i) => `<button type="button" class="stage" data-nav="navPartners"><span class="n num">${n}</span><span class="l">${esc(t('st' + (i + 1)))}</span></button>`).join('')}</div>

      for (let w = 0; w < 12; w++) {

      <div class="heat" role="img" aria-label="${esc(t('revSub'))}">${cells}</div>
      <div class="heat-legend"><span>${esc(t('less'))}</span>${[0, 1, 2, 3, 4].map((l) => `<i class="cell" style="background:var(--heat-${l})"></i>`).join('')}<span>${esc(t('more'))}</span></div>
      <p class="cap" style="margin:8px 0 0">${esc(t('revSub'))}</p>`;

      <div class="card-head" style="margin-bottom:12px"><h3>${esc(t('insightsTitle'))}</h3></div>

  /* ---------------- Trend chart (SVG, sized to its box) ---------------- */
  function drawTrend(animate) {
    const box = document.getElementById('trend');
    if (!box || !box.clientWidth) return;
    const W = box.clientWidth, H = box.clientHeight;
    const L = 36, R = 44, T = 14, B = 26;
    const x = (i) => L + (i * (W - L - R)) / (TREND.length - 1);
    const y = (v) => T + (1 - v / 75) * (H - T - B);
    const pts = TREND.map((v, i) => [x(i), y(v)]);
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {           // monotone-ish smoothing
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2;
      d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`;
    }
    const area = `${d} L${x(TREND.length - 1)},${y(0)} L${x(0)},${y(0)} Z`;
    const ticks = [0, 25, 50, 75].map((v) => `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`).join('');
    const xl = [0, 3, 6, 9, 11].map((i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 11 ? 'end' : i === 0 ? 'start' : 'middle'}">${WEEKS[i]}</text>`).join('');
    const last = pts[pts.length - 1];
    const ty = y(60);
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
      <defs><linearGradient id="tg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--brand);stop-opacity:.18"/><stop offset="1" style="stop-color:var(--brand);stop-opacity:0"/></linearGradient></defs>
      ${ticks}${xl}
      <path d="${area}" fill="url(#tg)"/>
      <line class="ref" x1="${L}" x2="${W - R}" y1="${ty}" y2="${ty}"/>
      <text class="ref-t" x="${L + 6}" y="${ty - 6}">${esc(t('target', { n: 60 }))}</text>
      <path class="line${animate && !reduced() ? ' draw' : ''}" d="${d}"/>
      <line class="guide" id="tguide" x1="0" x2="0" y1="${T}" y2="${y(0)}" style="opacity:0"/>
      <circle class="cur" id="tdot" cx="${last[0]}" cy="${last[1]}" r="4.5"/>
      <text class="cur-t" x="${last[0] + 8}" y="${last[1] + 4}">${TREND[TREND.length - 1]}%</text>
      <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" id="thit"/>
    </svg><div class="tip" id="ttip" style="opacity:0"></div>`;
    const line = box.querySelector('.line.draw');
    if (line) line.style.setProperty('--len', line.getTotalLength());
    const hit = box.querySelector('#thit'), guide = box.querySelector('#tguide'), dot = box.querySelector('#tdot'), tip = box.querySelector('#ttip');
    const show = (i) => {
      const [px, py] = pts[i];
      guide.setAttribute('x1', px); guide.setAttribute('x2', px); guide.style.opacity = 1;
      dot.setAttribute('cx', px); dot.setAttribute('cy', py);
      tip.innerHTML = `<div class="t">${esc(t('week'))} ${WEEKS[i]}</div><div class="r"><i></i>${esc(t('progress'))}<b>${TREND[i]}%</b></div>`;
      tip.style.opacity = 1;
      const tw = tip.offsetWidth;
      tip.style.left = Math.min(Math.max(0, px + 12), W - tw) + 'px';
      tip.style.top = Math.max(0, py - 56) + 'px';
    };
    const hide = () => { guide.style.opacity = 0; tip.style.opacity = 0; dot.setAttribute('cx', last[0]); dot.setAttribute('cy', last[1]); };
    hit.addEventListener('pointermove', (e) => {
      const r = box.getBoundingClientRect();
      const i = Math.round(((e.clientX - r.left - L) / (W - L - R)) * (TREND.length - 1));
      show(Math.max(0, Math.min(TREND.length - 1, i)));
    });
    hit.addEventListener('pointerleave', hide);
  }

  /* ---------------- Motion helpers ---------------- */
  function countUp(root) {
    if (reduced()) return;
    root.querySelectorAll('[data-count]').forEach((el) => {
      const to = +el.dataset.count, t0 = performance.now(), dur = 600;
      const step = (now) => {
        const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
        el.textContent = fmt(Math.round(to * e));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
    const ring = root.querySelector('[data-ring]');
    if (ring) {
      const C = +ring.dataset.ring, pct = +ring.dataset.pct;
      ring.style.transition = 'none'; ring.style.strokeDashoffset = C;
      ring.getBoundingClientRect();
      ring.style.transition = ''; ring.style.strokeDashoffset = C * (1 - pct / 100);
    }
  }

  function celebrate() {
    toast(t('goalDone', { g: 'Build a literature review workflow', d: 'becoming an AI-assisted researcher' }));
    if (reduced()) return;
    const cv = document.querySelector('.c-prog .confetti');
    if (!cv) return;
    const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    const cs = getComputedStyle(document.documentElement);
    const cols = [1, 2, 3, 4, 5].map((i) => cs.getPropertyValue('--chart-' + i).trim());
    const P = Array.from({ length: 24 }, (_, i) => ({
      x: r.width / 2, y: r.height * 0.42, vx: (Math.random() - .5) * 7, vy: -Math.random() * 6 - 2,
      s: 4 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[i % 5],
    }));
    const t0 = performance.now();
    const frame = (now) => {
      const p = (now - t0) / 1200;
      ctx.clearRect(0, 0, r.width, r.height);
      if (p >= 1) return;
      ctx.globalAlpha = 1 - p;
      for (const q of P) {
        q.vy += .22; q.x += q.vx; q.y += q.vy; q.rot += q.vr;
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillStyle = q.c; ctx.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); ctx.restore();
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  function toast(msg, undo) {
    const host = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `${icon('done')}<span>${esc(msg)}</span>${undo ? `<button class="link" type="button">${esc(t('undo'))}</button>` : ''}`;
    if (undo) el.querySelector('button').addEventListener('click', () => { undo(); el.remove(); });
    host.appendChild(el);
    while (host.children.length > 3) host.firstElementChild.remove();
    setTimeout(() => el.remove(), 4500);
  }

  /* ---------------- Render ---------------- */
  let ro;
  function render(animate = false) {
    document.documentElement.lang = lang;
    document.body.classList.toggle('is-coach', role === 'coach');
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('[data-t-aria]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.tAria)));
    document.getElementById('greet').textContent = role === 'coach' ? t('coachGreeting') : t('greeting');
    const fa = document.getElementById('f-area'), fp = document.getElementById('f-period');
    fa.innerHTML = `<option value="all">${esc(t('allAreas'))}</option>` + AREAS.slice().sort((a, b) => a.slot - b.slot).map((x) => `<option value="${x.id}">${esc(t('area_' + x.id))}</option>`).join('');
    fa.value = area;
    fp.innerHTML = ['month', 'quarter', 'year'].map((p) => `<option value="${p}">${esc(t(p))}</option>`).join('');
    fp.value = period;
    document.querySelector('.page-head .head-actions').style.visibility = state === 'first' ? 'hidden' : '';
    const view = document.getElementById('view');
    view.innerHTML = state === 'loading' ? skeleton() : state === 'first' ? firstRun() : dashboard();
    if (ro) ro.disconnect();
    const tb = document.getElementById('trend');
    if (tb) { let first = animate; ro = new ResizeObserver(() => { drawTrend(first); first = false; }); ro.observe(tb); }
    if (animate) countUp(view);
    else view.querySelectorAll('.bar > i, .stack > span').forEach((el) => { el.style.animation = 'none'; });
    for (const [id, cur] of [['pv-theme', store.get('theme') || 'system'], ['pv-lang', lang], ['pv-state', state], ['pv-role', role]]) {
      document.querySelectorAll(`#${id} button`).forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === cur));
    }
  }

  function applyTheme(v) {
    if (v === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', v);
    store.set('theme', v);
  }

  /* ---------------- Events ---------------- */
  document.addEventListener('click', (e) => {
    const seg = e.target.closest('.seg button');
    if (seg) {
      const g = seg.parentElement.id, v = seg.dataset.v;
      if (g === 'pv-theme') { applyTheme(v); render(); return; }
      if (g === 'pv-lang') { lang = v; store.set('lang', v); render(); return; }
      if (g === 'pv-state') { state = v; store.set('state', v); render(true); return; }
      if (g === 'pv-role') { role = v; store.set('role', v); render(); return; }
    }
    if (e.target.closest('#pv-celebrate')) { if (state !== 'normal') { state = 'normal'; render(); } celebrate(); return; }
    const chk = e.target.closest('[data-done]');
    if (chk) {
      const id = +chk.dataset.done, task = TASKS.find((x) => x.id === id);
      if (done.has(id)) done.delete(id); else { done.add(id); toast(t('taskDone', { t: task.title }), () => { done.delete(id); render(); }); }
      render(); return;
    }
    const vt = e.target.closest('[data-view-toggle]');
    if (vt) {
      const id = vt.dataset.viewToggle, on = vt.getAttribute('aria-pressed') !== 'true';
      vt.setAttribute('aria-pressed', on);
      vt.innerHTML = `${icon(on ? 'chart' : 'table')}<span>${esc(t(on ? 'chart' : 'table'))}</span>`;
      document.querySelector(`[data-viz="${id}"]`).hidden = on;
      document.querySelector(`[data-tbl="${id}"]`).hidden = !on;
      return;
    }
    const tb = e.target.closest('[data-tab]');
    if (tb) { tab = tb.dataset.tab; selectTab(); return; }
    if (e.target.closest('[data-more]')) { showMore = !showMore; const g = document.getElementById('grid'); g.classList.toggle('show-more', showMore); e.target.closest('[data-more]').setAttribute('aria-expanded', showMore); return; }
    if (e.target.closest('[data-show-all]')) { document.querySelector('.c-areas').classList.add('show-all'); e.target.closest('[data-show-all]').remove(); return; }
    if (e.target.closest('[data-retry]')) { state = 'normal'; store.set('state', 'normal'); render(true); return; }
    const nav = e.target.closest('[data-nav]');
    if (nav) {
      const k = nav.dataset.nav;
      const x = k === 'addTask' ? t('navAdd') : t(k, { x: nav.dataset.x || '' });
      toast(t('nav', { x }));
    }
  });
  function selectTab() {
    document.querySelectorAll('.tab').forEach((b) => { const on = b.dataset.tab === tab; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; if (on) b.focus(); });
    document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('is-active', p.id === 'p-' + tab));
  }
  document.addEventListener('keydown', (e) => {
    if (!e.target.classList || !e.target.classList.contains('tab')) return;
    const ids = ['obst', 'part', 'rev'];
    let i = ids.indexOf(tab);
    if (e.key === 'ArrowRight') i = (i + 1) % 3; else if (e.key === 'ArrowLeft') i = (i + 2) % 3; else return;
    e.preventDefault(); tab = ids[i]; selectTab();
  });
  document.getElementById('f-area').addEventListener('change', (e) => { area = e.target.value; render(); });
  document.getElementById('f-period').addEventListener('change', (e) => { period = e.target.value; render(); });

  applyTheme(store.get('theme') || 'system');
  render(true);
})();
</script>
