# V10 (SEC-03-01, SEC-03-03): weekly update pull requests for every kind of
# dependency. Minor and patch updates are grouped into one pull request per
# ecosystem to keep the review load small; security updates always come
# through on their own. CI must pass before merging.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # CLAUDE.md fixes the backend on Spring Boot 3.x. Minor and patch updates
    # still come through; a move to Spring Boot 4 is a decision made by hand.
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: ["version-update:semver-major"]
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # CLAUDE.md fixes React and React DOM at exactly 19.2.7. Change them by
    # hand, together, only when that decision changes.
    ignore:
      - dependency-name: react
      - dependency-name: react-dom
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    # Both images stay on Java 17 (the build and runtime must match). Patch
    # updates within 17 still come through; moving to a newer long-term
    # release (21 or 25) is done by hand, never to a short-term one.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: maven
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
