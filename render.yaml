databases:
  - name: vision-mapping-db
    databaseName: vision_mapping
    user: vision_mapping
    # Basic-256MB, not free: free Postgres is deleted 30 days after creation
    # (plus a 14-day grace period). This must stay in step with the dashboard —
    # Blueprint auto-sync overwrites manual plan changes on the next push.
    plan: basic-256mb

services:
  # Redis-compatible cache for FR-30. Cache entries are disposable (10-minute
  # TTL, rebuilt from Postgres on a miss), so the free ephemeral tier is
  # enough; losing it entirely only slows requests down (BR-21).
  - type: keyvalue
    name: vision-mapping-cache
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal connections only

  # Spring Boot API — deployed from backend/Dockerfile
  - type: web
    name: vision-mapping-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Starter, not free: free web services spin down after 15 minutes idle, and
    # the next request pays a 30-60s JVM + Spring cold boot. That request is the
    # user's login, which is why the first login felt broken.
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      # V10 (SEC-04-03): encrypts secrets saved in the database (the Claude
      # API key). The prod profile refuses to start without it. The Claude key
      # saved before V10 still opens with the old JWT-derived key; it is sealed
      # with this one the next time an admin saves it.
      - key: SETTINGS_ENCRYPTION_KEY
        generateValue: true
      # V10 (SEC-07-04): access tokens last 30 minutes and are renewed in the
      # background with a refresh token; sessions last 30 days with "remember me".
      - key: JWT_EXPIRATION_MINUTES
        value: "30"
      - key: DB_HOST
        fromDatabase:
          name: vision-mapping-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: vision-mapping-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: vision-mapping-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: vision-mapping-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: vision-mapping-db
          property: password
      # FR-30: both vars together switch the cache on; removing them reverts
      # the backend to its uncached behavior without a code change.
      - key: CACHE_TYPE
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vision-mapping-cache
          property: connectionString
      # Update this if the frontend service ends up on a different
      # Render subdomain than the one predicted below.
      - key: CORS_ALLOWED_ORIGINS
        value: https://vision-mapping-frontend.onrender.com
      # Password recovery. The link points at the frontend route that redeems
      # it, not at the API — the user lands on a form, and that form calls
      # /api/auth/reset-password.
      - key: PASSWORD_RESET_URL
        value: https://vision-mapping-frontend.onrender.com/reset-password
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "30"
      # Email delivery is OFF until these are set. Without MAIL_HOST the backend
      # still issues valid tokens but writes the link to the log instead of
      # sending it — deliberately, so an unconfigured deploy fails visibly in the
      # log rather than silently swallowing every reset. Set MAIL_HOST,
      # MAIL_USERNAME and MAIL_PASSWORD in the Render dashboard (they are secrets
      # and must not be committed here) to turn real delivery on.
      - key: MAIL_FROM
        value: no-reply@visionmapping.app

  # React/Vite SPA — static build, served from frontend/dist
  - type: web
    name: vision-mapping-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Update this if the backend service ends up on a different
      # Render subdomain than the one predicted above.
      - key: VITE_API_BASE_URL
        value: https://vision-mapping-backend.onrender.com/api
    routes:
      # SPA fallback so React Router routes don't 404 on refresh/direct link
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Everything Vite emits into /assets carries a content hash in its name,
      # so a given URL's bytes can never change — a new build writes new names.
      # That makes them safe to cache permanently, which is what "immutable"
      # tells the browser: don't even revalidate. Fonts are hashed the same way.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html is the one file whose name never changes, and it is what
      # points at the hashed bundles. Caching it would pin the browser to an old
      # deploy's asset names, so it is always revalidated.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # V10 (SEC-02-01, SEC-02-02): security headers on every page.
      # CSP: scripts, fonts and styles come only from this site (fonts are
      # self-hosted through @fontsource). 'unsafe-inline' for styles is needed
      # by MUI/Emotion, which inject <style> tags at runtime; scripts stay
      # strict. Images may be any https URL because a dream's picture is a link
      # the user pastes. connect-src must match VITE_API_BASE_URL above.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://vision-mapping-backend.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
