spring:
  application:
    name: vision-mapping-backend
  profiles:
    active: local
  # Recovery email. With no host set, Spring builds no JavaMailSender and
  # PasswordResetMailer logs the link at WARN instead of sending — so the flow is
  # exercisable locally, and an unconfigured deployment issues valid tokens
  # rather than failing to start. Set MAIL_HOST to switch to real delivery.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

app:
  security:
    jwt-secret: ${JWT_SECRET:vision-mapping-development-secret-key-change-before-production}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  password-reset:
    # Long enough to go and find the mail, short enough that a link left sitting
    # in a mailbox stops being a key to the account.
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    # The frontend route that redeems the link, not an API path — the user lands
    # on a form, and that form calls /api/auth/reset-password.
    reset-url: ${PASSWORD_RESET_URL:http://127.0.0.1:5173/reset-password}
    # Two limits doing different jobs: per-address stops the endpoint being used
    # to flood one inbox, per-IP stops one caller working through a list of
    # addresses. Both are checked before the account lookup, so neither can
    # reveal which addresses are registered.
    rate-limit:
      per-email: ${PASSWORD_RESET_LIMIT_PER_EMAIL:3}
      per-email-window-minutes: ${PASSWORD_RESET_LIMIT_EMAIL_WINDOW:15}
      per-ip: ${PASSWORD_RESET_LIMIT_PER_IP:20}
      per-ip-window-minutes: ${PASSWORD_RESET_LIMIT_IP_WINDOW:60}
  mail:
    from: ${MAIL_FROM:no-reply@visionmapping.app}

---
spring:
  config:
    activate:
      on-profile: local
  # FR-30: caching is opt-in — the app runs uncached (exactly as before) unless
  # CACHE_TYPE=redis is set. Short timeouts keep a dead Redis cheap: failures
  # degrade to cache misses (BR-21), never to failed requests.
  cache:
    type: ${CACHE_TYPE:none}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 500ms
      connect-timeout: 500ms
  datasource:
    url: jdbc:postgresql://localhost:5432/vision_mapping
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: prod
  # FR-30: render.yaml enables the cache by setting CACHE_TYPE=redis and
  # injecting REDIS_URL from the Key Value service. Without them the backend
  # boots and behaves exactly as before (FR-30 AC-3).
  cache:
    type: ${CACHE_TYPE:none}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 500ms
      connect-timeout: 500ms
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Sized for the instance rather than for throughput. Hikari defaults to ten
    # connections, which 0.5 of a CPU cannot use concurrently and which cost
    # memory on both sides — the database is a 256MB plan. Five is comfortably
    # more than the capped Tomcat thread pool will ask for at once.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Bounded for the 512MB / 0.5-CPU Render instance. The container was killed with
# "used over 512Mi" on the first request after startup, and these defaults are a
# large part of why: Tomcat allows 200 request threads, so the stack space alone
# could outgrow the heap, and half a CPU cannot service 200 concurrent requests
# anyway — the queue is the honest place to hold them. Hikari's default of ten
# connections is likewise more than this instance or the 256MB database needs.
#
# These are a resource ceiling, not a tuning preference. Raise them together
# with the instance size, not on their own.
server:
  tomcat:
    threads:
      max: 20
      min-spare: 4
    # Requests beyond the thread pool wait here rather than being refused.
    accept-count: 100
    max-connections: 200

---
spring:
  config:
    activate:
      on-profile: test
  # FR-30: an in-memory cache lets the caching, key-scoping, and eviction
  # tests run without a Redis server.
  cache:
    type: simple
  datasource:
    url: jdbc:h2:mem:vision_mapping_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
