# SonarQube Cloud analysis for the whole repository (backend and frontend).
# CI runs it after the backend and frontend jobs, using their coverage reports.
# The organization and project key are the defaults SonarQube Cloud gives a
# GitHub repo; change them here if yours differ.
sonar.organization=sot-sirymony
sonar.projectKey=Sot-Sirymony_vmap-sys
sonar.projectName=Vision Mapping Management System

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.sourceEncoding=UTF-8

# Backend: compiled classes for the Java rules, and JaCoCo coverage.
sonar.java.source=17
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Frontend: Vitest coverage.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Known false alarms, each limited to one rule in one file.
# km.ts holds Khmer translations keyed by their English text, so labels such as
# "Password" and "New password" read to the hard-coded password rule as secrets.
sonar.issue.ignore.multicriteria=khmerText
sonar.issue.ignore.multicriteria.khmerText.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.khmerText.resourceKey=frontend/src/i18n/km.ts
